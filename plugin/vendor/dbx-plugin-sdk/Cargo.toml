# 本文件相对上游只有一处改动：删掉了原来的空 `[workspace]` 段。
# 上游用它把自己声明成独立 workspace 根，但在本仓库里它是被 plugin/backend
# path 依赖的包，cargo 会报 "multiple workspace roots found"。改成由仓库根
# workspace 统一收编。license 保持 Apache-2.0，不随本仓库的 MIT。
[package]
name = "dbx-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sidecar protocol SDK for DBX plugins"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
