  <path filter="url(#soft-26)" fill="url(#aurora-b)" opacity=".45"
        d="M-60 140C250 60 480 180 720 90C880 30 1000 80 1100 50L1100 130C980 160 840 110 680 190C460 290 220 150-60 240Z"/>

  <!-- 月亮与星 -->
  <circle cx="168" cy="128" r="64" fill="url(#moon-glow)"/>
  <circle cx="168" cy="128" r="30" fill="#e6efff" opacity=".95"/>
  <circle cx="157" cy="119" r="6" fill="#c9d8f2" opacity=".5"/>
  <circle cx="178" cy="138" r="4" fill="#c9d8f2" opacity=".4"/>
  <g fill="#cfe6ff">
    <circle cx="88" cy="230" r="2.2" opacity=".8"/><circle cx="250" cy="70" r="1.6" opacity=".6"/>
    <circle cx="340" cy="180" r="2.6" opacity=".9"/><circle cx="430" cy="90" r="1.5" opacity=".5"/>
    <circle cx="520" cy="150" r="2" opacity=".7"/><circle cx="610" cy="70" r="1.7" opacity=".6"/>
    <circle cx="700" cy="140" r="2.4" opacity=".85"/><circle cx="790" cy="60" r="1.5" opacity=".5"/>
    <circle cx="880" cy="150" r="2.2" opacity=".75"/><circle cx="960" cy="80" r="1.6" opacity=".55"/>
    <circle cx="120" cy="360" r="1.8" opacity=".5"/><circle cx="230" cy="300" r="2.2" opacity=".7"/>
    <circle cx="470" cy="250" r="1.4" opacity=".45"/><circle cx="830" cy="260" r="2" opacity=".65"/>
    <circle cx="940" cy="330" r="1.7" opacity=".5"/><circle cx="60" cy="480" r="1.9" opacity=".5"/>
    <circle cx="980" cy="470" r="2.1" opacity=".6"/><circle cx="380" cy="330" r="1.5" opacity=".45"/>
  </g>
  <g stroke="#e8f4ff" stroke-width="2.4" stroke-linecap="round" opacity=".9">
    <path d="M300 118v18M291 127h18"/>
    <path d="M760 208v14M753 215h14" opacity=".7"/>
    <path d="M905 230v16M897 238h16" opacity=".8"/>
    <path d="M150 290v12M144 296h12" opacity=".6"/>
  </g>

  <!-- 海面与城市灯火 -->
  <rect y="880" width="1024" height="144" fill="url(#water)"/>
  <path fill="#080d1f" opacity=".97"
        d="M0 880V845H40V820H90V850H150V805H210V838H280V815H350V855H430V825H520V850H610V810H700V842H790V818H870V848H940V828H1024V880Z"/>
  <g fill="#ffd98a">
    <rect x="58" y="830" width="4" height="6" opacity=".7"/><rect x="72" y="842" width="4" height="6" opacity=".4"/>
    <rect x="166" y="816" width="4" height="6" opacity=".8"/><rect x="182" y="828" width="4" height="6" opacity=".35"/>
    <rect x="196" y="816" width="4" height="6" opacity=".55"/><rect x="298" y="826" width="4" height="6" opacity=".6"/>
    <rect x="316" y="838" width="4" height="6" opacity=".3"/><rect x="448" y="836" width="4" height="6" opacity=".65"/>
    <rect x="470" y="846" width="4" height="6" opacity=".35"/><rect x="628" y="822" width="4" height="6" opacity=".75"/>
    <rect x="648" y="834" width="4" height="6" opacity=".4"/><rect x="666" y="822" width="4" height="6" opacity=".55"/>
    <rect x="806" y="828" width="4" height="6" opacity=".6"/><rect x="824" y="840" width="4" height="6" opacity=".3"/>
    <rect x="888" y="830" width="4" height="6" opacity=".7"/><rect x="956" y="838" width="4" height="6" opacity=".45"/>
  </g>
  <g opacity=".3">
    <rect x="150" y="902" width="70" height="3" rx="1.5" fill="#ffd98a"/>
    <rect x="610" y="910" width="90" height="3" rx="1.5" fill="#ffd98a" opacity=".7"/>
    <rect x="330" y="926" width="120" height="3" rx="1.5" fill="#3fe0c8" opacity=".6"/>
    <rect x="760" y="940" width="100" height="3" rx="1.5" fill="#3fe0c8" opacity=".5"/>
    <rect x="80" y="954" width="140" height="3" rx="1.5" fill="#4fc3f7" opacity=".5"/>
    <rect x="480" y="968" width="160" height="3" rx="1.5" fill="#3fe0c8" opacity=".4"/>
  </g>

  <!-- 头部后方的极光余晖 -->
  <circle cx="560" cy="450" r="280" fill="url(#head-glow)"/>

  <!-- 肩与上衣 -->
  <path fill="url(#coat)" d="M258 1024C268 922 322 852 414 824C462 808 560 808 608 824C700 852 756 930 770 1024Z"/>
  <path d="M608 824C700 852 756 930 770 1024" fill="none" stroke="#5ce8d6" stroke-width="5" opacity=".5" stroke-linecap="round"/>
  <path d="M414 824C322 852 268 922 258 1024" fill="none" stroke="#0a0f26" stroke-width="6" opacity=".6"/>

  <!-- 散落的发缕（轮廓外） -->
  <path fill="#1a2247" d="M672 640C724 652 756 696 748 752C744 780 724 802 702 806C722 780 730 748 722 716C714 684 694 660 672 640Z"/>
  <path fill="none" stroke="#5ce8d6" stroke-width="4" opacity=".6" stroke-linecap="round" d="M684 652C724 666 748 700 742 748"/>
  <path fill="#151c3a" d="M336 660C296 676 272 716 280 762C284 788 300 806 320 812C304 786 300 754 310 724C318 696 328 676 336 660Z"/>

  <!-- 长发背影：发尾收成尖束， anime 式分组 -->
  <path fill="url(#hair)"
        d="M505 312C408 312 340 384 330 476C322 548 328 616 344 676C318 706 304 770 330 824C310 852 310 892 336 916L352 952C366 928 380 916 396 910L418 956C434 926 448 916 466 912L492 958C510 928 524 918 542 914L570 954C588 924 602 912 620 906L648 944C664 916 672 898 674 878C700 862 712 824 690 792C712 744 698 682 678 648C688 572 680 498 652 444C620 360 562 312 505 312Z"/>
  <!-- 发丝分组：深色沟 + 浅色棱 -->
  <g fill="none" stroke="#0d1229" stroke-linecap="round" opacity=".55">
    <path d="M430 400C410 480 408 580 425 660C432 720 420 800 396 880" stroke-width="8"/>
    <path d="M505 345C495 440 495 560 505 680C510 760 500 840 480 910" stroke-width="7" opacity=".8"/>
    <path d="M580 400C595 480 598 580 585 660C578 740 592 820 620 880" stroke-width="8"/>
    <path d="M392 520C386 590 390 660 405 720C412 780 400 850 372 905" stroke-width="6" opacity=".7"/>
    <path d="M640 520C648 590 644 660 630 720C622 780 634 840 656 885" stroke-width="6" opacity=".7"/>
  </g>
  <!-- 天使环： anime 头发高光带 -->
  <path d="M382 436C432 400 582 400 634 440" fill="none" stroke="#4a5f9e" stroke-width="14" opacity=".4" stroke-linecap="round" filter="url(#soft-3)"/>
  <path d="M620 430C635 500 638 580 628 650" fill="none" stroke="#3a5a8f" stroke-width="5" opacity=".6" stroke-linecap="round"/>
  <!-- 极光从右上方打的轮廓光 -->
  <path d="M652 444C680 498 688 572 678 648C698 682 712 744 690 792" fill="none" stroke="#5ce8d6" stroke-width="6" opacity=".75" stroke-linecap="round" filter="url(#soft-3)"/>
  <path d="M505 312C562 312 620 360 652 444" fill="none" stroke="#6ff2de" stroke-width="5" opacity=".55" stroke-linecap="round"/>

  <!-- 耳机：头梁跨过发顶，两侧耳罩 -->
  <path d="M358 548C346 398 414 300 505 292C596 300 664 398 652 548" fill="none" stroke="#2e3763" stroke-width="32" stroke-linecap="round"/>
  <path d="M364 518C358 398 420 306 505 300C590 306 652 398 646 518" fill="none" stroke="#57e6d4" stroke-width="5" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="352" cy="582" rx="48" ry="70" fill="#1b2247" stroke="#414c7d" stroke-width="3"/>
  <ellipse cx="352" cy="582" rx="30" ry="48" fill="#0e1430" stroke="#4fe3d2" stroke-width="4" opacity=".95"/>
  <ellipse cx="662" cy="576" rx="62" ry="84" fill="#1b2247" stroke="#414c7d" stroke-width="3"/>
  <ellipse cx="662" cy="576" rx="41" ry="61" fill="#0e1430" stroke="#4fe3d2" stroke-width="5"/>
  <ellipse cx="662" cy="576" rx="18" ry="29" fill="#16204a"/>
  <ellipse cx="662" cy="576" rx="51" ry="73" fill="none" stroke="#4fe3d2" stroke-width="10" opacity=".18" filter="url(#soft-3)"/>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>