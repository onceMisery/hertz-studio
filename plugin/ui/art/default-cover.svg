<!-- Original artwork for Hertz Studio. All shapes are local vector paths. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">极光下的聆听者</title>
  <desc id="cover-description">夜色里，戴耳机的长发女孩背影望向海面与城市灯火，青绿色极光在星空流动。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset=".5" stop-color="#111c44"/>
      <stop offset=".8" stop-color="#1d2c58"/>
      <stop offset="1" stop-color="#25355f"/>
    </linearGradient>
    <linearGradient id="aurora-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37e6c8" stop-opacity="0"/>
      <stop offset=".3" stop-color="#37e6c8" stop-opacity=".85"/>
      <stop offset=".65" stop-color="#7ef0a8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#37e6c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset=".45" stop-color="#4fc3f7" stop-opacity=".6"/>
      <stop offset=".8" stop-color="#8ef0c0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#060a17"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#26305c"/>
      <stop offset=".55" stop-color="#1a2247"/>
      <stop offset="1" stop-color="#11162f"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a52"/>
      <stop offset="1" stop-color="#10152e"/>
    </linearGradient>
    <radialGradient id="head-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3fe0c8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3fe0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dfe9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#dfe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".75">
      <stop offset=".55" stop-color="#04071a" stop-opacity="0"/>
      <stop offset="1" stop-color="#04071a" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft-22" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft-26" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft-3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- 极光两条光带，一青一蓝，错相位流动 -->
  <path filter="url(#soft-22)" fill="url(#aurora-a)" opacity=".6"
