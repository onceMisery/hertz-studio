<!--
  OBS 歌词浮层页（folia 浮层输出的等价物）。

  用法：在 OBS 里添加「浏览器源」，URL 用应用设置页「歌词输出」里复制的地址：
    http://127.0.0.1:7634/overlay?key=<浮层只读钥匙>&style=<风格>
  （`key` 是权限收窄的只读钥匙，只认浮层歌词与曲目封面两条 GET。老的
  `?token=<长期令牌>` 链接继续可用，但它权限太大，建议换成 key。）
  风格四种：
    full     全页歌词：完整歌词列表滚动，当前行高亮（默认）
    line     单行大字：屏幕中央只显示当前行
    karaoke  点唱机：封面 + 标题/歌手 + 当前行 + 进度
    minimal  底部条：左下角标题与当前行，其余全透明

  可选参数：
    &scale=1.2        全局字号倍率
    &align=left       full 模式文本对齐（left|center|right，默认 center）
    &color=%23ffffff  文字主色（十六进制，需 URL 编码 #）
    &dim=0.45         非当前行透明度（0-1，full 模式）

  自定义素材（背景图 / 台标）不走 URL：上传的图没有可分享的地址，塞不进查询串，
  远程 OBS 也读不到本应用的存储。它们在应用设置页「歌词输出」里选，由那边压成
  data URL 拼成一段 CSS，粘进 OBS「浏览器源 → 自定义 CSS」；本页用
  getComputedStyle 把 --hz-obs-bg / --hz-obs-logo / --hz-obs-logo-pos 读回来
  （形状与解析都在 obs-css.js）。没有注入就是全透明。

  词级时序（增强 LRC `[00:12.00]词[00:12.50]词`）的曲目自动进入逐字扫色：
  当前行「已唱亮、未唱暗、正在唱的词从左往右扫亮」；没有词级时序的行
  回退整行高亮，两种形态按行自动混用。

  页面 500ms 轮询一次 /v1/overlay/lyric，两次轮询之间用本地时钟内插进度，
  所以歌词滚动是平滑的、不跟着轮询节拍一跳一跳。背景默认全透明（OBS 浏览器
  源默认透明），需要底色请在 OBS 里叠一层，或者用上面那条素材通道送一张背景图。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hertz-studio · 歌词浮层</title>
<style>
  :root {
    --fg: #f5f6f7;
    --fg-dim: rgba(245, 246, 247, 0.4);
    --accent: #7dd8ff;
    --scale: 1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---------- full：全页歌词 ---------- */
  .full { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 6vh 7vw; }
  .full .lines { overflow: hidden; max-height: 100%; }
  .full .inner { display: flex; flex-direction: column; gap: calc(14px * var(--scale)); transition: transform 0.45s cubic-bezier(.25,.8,.3,1); }
  .full .l {
    font-size: calc(24px * var(--scale));
    line-height: 1.45;
    color: var(--fg-dim);
    transition: color 0.3s, transform 0.3s, opacity 0.3s;
    transform-origin: left center;
  }
  .full .l.active { color: var(--fg); font-weight: 600; transform: scale(1.06); }
  .full .l.past { opacity: 0.55; }
  .full .l .tr { display: block; font-size: 0.62em; color: var(--fg-dim); font-weight: 400; }
  .full .l.active .tr { color: var(--fg-dim); }

  /* ---------- line：单行大字 ---------- */
  .line { height: 100%; display: grid; place-items: center; padding: 0 8vw; text-align: center; }
  .line .cur {
    font-size: calc(44px * var(--scale));
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    transition: opacity 0.25s;
    max-width: 100%;
  }
  .line .cur.empty { opacity: 0.25; font-weight: 400; }
  .line .cur .tr { display: block; font-size: 0.5em; font-weight: 400; opacity: 0.6; margin-top: 0.35em; }

  /* ---------- karaoke：点唱机 ---------- */
  .karaoke { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(18px * var(--scale)); padding: 5vh 6vw; text-align: center; }
  .karaoke .cover-wrap { width: calc(150px * var(--scale)); height: calc(150px * var(--scale)); border-radius: 14px; overflow: hidden; box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5); background: rgba(255, 255, 255, 0.06); flex: none; }
  .karaoke .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .karaoke .cover-wrap .disc { width: 100%; height: 100%; display: grid; place-items: center; font-size: calc(40px * var(--scale)); opacity: 0.3; }
  .karaoke .meta { min-height: calc(30px * var(--scale)); }
  .karaoke .title { font-size: calc(22px * var(--scale)); font-weight: 700; }
  .karaoke .artist { font-size: calc(15px * var(--scale)); color: var(--fg-dim); margin-top: 2px; }
  .karaoke .cur {
    font-size: calc(26px * var(--scale));
    font-weight: 600;
    min-height: calc(36px * var(--scale));
    transition: opacity 0.25s;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
  }
  .karaoke .cur.empty { opacity: 0.25; font-weight: 400; }
  .karaoke .cur .tr { display: block; font-size: 0.6em; font-weight: 400; opacity: 0.6; }
  .karaoke .bar { width: min(420px, 70%); height: calc(4px * var(--scale)); border-radius: 99px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .karaoke .bar i { display: block; height: 100%; width: 0%; border-radius: 99px; background: var(--accent); transition: width 0.2s linear; }
  .karaoke .paused { position: absolute; top: 14px; right: 18px; font-size: calc(13px * var(--scale)); color: var(--fg-dim); letter-spacing: 2px; }

  /* ---------- minimal：底部条 ---------- */
  .minimal { height: 100%; display: flex; align-items: flex-end; padding: 0 0 5vh 4vw; }
  .minimal .box { border-left: 3px solid var(--accent); padding-left: 16px; }
  .minimal .title { font-size: calc(15px * var(--scale)); font-weight: 700; margin-bottom: 3px; }
  .minimal .title .artist { font-weight: 400; color: var(--fg-dim); }
  .minimal .cur { font-size: calc(20px * var(--scale)); min-height: calc(28px * var(--scale)); transition: opacity 0.25s; }
  .minimal .cur.empty { opacity: 0.25; }

  /* ---------- 逐字扫色（词级时序） ----------
     有词级时序的行按「已唱亮、未唱暗、正在唱的词从左往右扫亮」渲染：
     每个词是 .w 容器，.a 是暗色底本，.b 是亮色副本用 clip-path 裁出
     已唱部分。行没有词级时序就回退整行高亮。 */
  .w { position: relative; white-space: pre-wrap; }
  .w .a { color: var(--fg-dim); }
  .w .b { position: absolute; inset: 0; color: var(--fg); }

  /* ---------- OBS 自定义 CSS 送进来的素材 ----------
     变量值由下面的脚本从 getComputedStyle 读回来，再落到 body / 台标元素上；
     这里只管台标怎么摆。四个角对应 --hz-obs-logo-pos 的取值。 */
  .obs-logo { position: fixed; width: min(14vw, 14vh); max-width: 220px; opacity: 0.85; pointer-events: none; }
  .obs-logo.top-right { top: 4vh; right: 4vw; }
  .obs-logo.top-left { top: 4vh; left: 4vw; }
  .obs-logo.bottom-right { bottom: 4vh; right: 4vw; }
  .obs-logo.bottom-left { bottom: 4vh; left: 4vw; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="view full hidden" id="v-full">
    <div class="lines" id="full-lines"><div class="inner" id="full-inner"></div></div>
  </div>

  <div class="view line hidden" id="v-line">
    <div class="cur empty" id="line-cur">…</div>
  </div>

  <div class="view karaoke hidden" id="v-karaoke">
    <span class="paused hidden" id="karaoke-paused">已暂停</span>
    <div class="cover-wrap"><img id="karaoke-cover" alt="" class="hidden"><div class="disc" id="karaoke-disc">♪</div></div>
    <div class="meta">
      <div class="title" id="karaoke-title">未在播放</div>
      <div class="artist" id="karaoke-artist"></div>
    </div>
    <div class="cur empty" id="karaoke-cur">…</div>
    <div class="bar"><i id="karaoke-bar"></i></div>
  </div>

  <div class="view minimal hidden" id="v-minimal">
    <div class="box">
      <div class="title"><span id="min-title">未在播放</span> <span class="artist" id="min-artist"></span></div>
      <div class="cur empty" id="min-cur">…</div>
    </div>
  </div>

<script src="/obs-css.js"></script>
<script>
'use strict';
(function () {
  var params = new URLSearchParams(location.search);
  var TOKEN = params.get('token') || '';
  // 凭据只走查询串（OBS 里发不出请求头）。优先用**浮层只读钥匙**（`?key=`）：
  // 它权限窄得多，只认浮层歌词与曲目封面两条 GET —— 粘进 OBS 之后长期留着也
  // 不至于把整台服务交出去。老链接里的 `?token=` 继续接受，不做破坏性变更。
  var CRED = params.get('key')
    ? 'key=' + encodeURIComponent(params.get('key'))
    : 'token=' + encodeURIComponent(TOKEN);
  var STYLE = ['full', 'line', 'karaoke', 'minimal'].indexOf(params.get('style')) >= 0
    ? params.get('style') : 'full';
  var SCALE = Math.max(0.4, Math.min(4, parseFloat(params.get('scale')) || 1));
  var ALIGN = ['left', 'center', 'right'].indexOf(params.get('align')) >= 0
    ? params.get('align') : 'center';
  var COLOR = params.get('color');
  var DIM = Math.max(0, Math.min(1, parseFloat(params.get('dim')) || 0.45));

  document.documentElement.style.setProperty('--scale', String(SCALE));
  if (COLOR) {
    try { document.documentElement.style.setProperty('--fg', decodeURIComponent(COLOR)); } catch (e) { /* 坏颜色就用默认 */ }
  }

  var $ = function (id) { return document.getElementById(id); };
  var views = { full: $('v-full'), line: $('v-line'), karaoke: $('v-karaoke'), minimal: $('v-minimal') };
  views[STYLE].classList.remove('hidden');
  if (STYLE === 'full') views.full.style.textAlign = ALIGN;

  // OBS「自定义 CSS」送进来的素材（背景图 / 台标）：读得到就落上，读不到就当没配。
  // 这段只在启动时跑一次 —— 素材是静态的，OBS 改完 CSS 会刷新页面缓存重载本页。
  (function applyObsAssets() {
    var assets = window.ObsCss ? window.ObsCss.readAssets() : null;
    if (!assets) return;
    if (assets.background) {
      document.body.style.backgroundImage = 'url("' + assets.background + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    }
    if (assets.logo) {
      var logo = document.createElement('img');
      logo.className = 'obs-logo ' + assets.logoPos;
      logo.alt = '';
      logo.src = assets.logo;
      document.body.appendChild(logo);
    }
  })();

  var state = {
    trackId: null,
    lines: [],
    playing: false,
    positionMs: 0,
    durationMs: 0,
    fetchedAt: 0,
    lastActive: -1,
    coverFor: null,
    wordByWord: false,
  };

  function activeIndexAt(posMs) {
    var lines = state.lines;
    if (!lines.length) return -1;
    var lo = 0, hi = lines.length - 1, found = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (lines[mid].startTime * 1000 <= posMs) { found = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return found;
  }

  /// 两次轮询之间的播放位置：拿「抓取时刻的 position + 流逝的墙钟」内插，
  /// 暂停时停在抓取值上。这样歌词滚动是平滑的，不跟着 500ms 轮询一跳一跳。
  function interpolatedPos() {
    if (!state.playing) return state.positionMs;
    return state.positionMs + Math.max(0, performance.now() - state.fetchedAt);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /// 词级时序补全：LRC 词尾常缺（末词 / 源没给），用下一词起点或行尾兜底，
  /// 运行期就不用再猜边界。少于 2 个词的行没有逐字意义，回退整行。
  function wordsWithEnds(line) {
    var ws = line.words || [];
    if (!state.wordByWord || ws.length < 2) return null;
    var out = [];
    for (var i = 0; i < ws.length; i++) {
      var start = ws[i].startTime || 0;
      var end = ws[i].endTime;
      if (end == null) end = (ws[i + 1] && ws[i + 1].startTime) || line.endTime || start + 3;
      if (end < start) end = start;
      out.push({ text: ws[i].text || '', start: start, end: end });
    }
    return out;
  }

  /// 行 HTML：words 非空走逐字结构（.a 暗底本 + .b 亮副本，clip 由 sweep
  /// 每帧更新），否则整行文本。翻译行两种形态都挂在最后。
  function lineHtml(line, words) {
    var body;
    if (words) {
      body = words.map(function (w) {
        var t = esc(w.text);
        return '<span class="w" data-s="' + w.start + '" data-e="' + w.end + '">'
          + '<span class="a">' + t + '</span>'
          + '<span class="b" style="clip-path:inset(0 100% 0 0)">' + t + '</span></span>';
      }).join('');
    } else {
      body = esc(line.text);
    }
    return body + (line.translation ? '<span class="tr">' + esc(line.translation) + '</span>' : '');
  }

  /// 逐字扫色：按内插位置把每个词的亮色副本裁到「已唱比例」。posSec 是
  /// 曲内秒；只动 clip-path 一个属性，一帧几十个词毫无压力。
  function sweepRow(el, posSec) {
    if (!el) return;
    var spans = el.querySelectorAll('.w');
    for (var i = 0; i < spans.length; i++) {
      var s = +spans[i].getAttribute('data-s');
      var e = +spans[i].getAttribute('data-e');
      var p = posSec <= s ? 0 : posSec >= e ? 1 : (posSec - s) / (e - s || 1);
      spans[i].children[1].style.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(2) + '% 0 0)';
    }
  }

  function renderFull(active, posSec) {
    var inner = $('full-inner');
    if (state.trackId == null) { inner.innerHTML = ''; return; }
    if (!inner.childElementCount || inner.dataset.track !== state.trackId) {
      inner.dataset.track = state.trackId;
      inner.innerHTML = '';
      state.lines.forEach(function (line) {
        var div = document.createElement('div');
        div.className = 'l';
        div._line = line;
        div.innerHTML = lineHtml(line, null);
        inner.appendChild(div);
      });
      state.lastActive = -1;
    }
    if (active !== state.lastActive) {
      var rows = inner.children;
      var prev = state.lastActive;
      // 只重建新旧两行：active 行换成逐字结构（有词级时序时），失焦行
      // 恢复整行文本——扫色进度只在当前行有意义，长歌词也不必全量重排。
      [prev, active].forEach(function (i) {
        if (i == null || i < 0 || !rows[i]) return;
        var row = rows[i];
        var isActive = i === active;
        row.classList.toggle('active', isActive);
        row.classList.toggle('past', i < active);
        row.style.opacity = isActive ? '' : String(Math.max(0.15, DIM));
        row.innerHTML = lineHtml(
          row._line,
          isActive ? wordsWithEnds(row._line) : null
        );
      });
      if (active >= 0) {
        var viewport = $('full-lines').clientHeight;
        var row = rows[active];
        var offset = row.offsetTop - viewport / 2 + row.offsetHeight / 2;
        inner.style.transform = 'translateY(' + (-Math.max(0, offset)) + 'px)';
      }
      state.lastActive = active;
    }
    if (active >= 0) sweepRow(inner.children[active], posSec);
  }

  function renderSingle(el, active, posSec) {
    if (state.trackId == null) { el.textContent = '…'; el.classList.add('empty'); return; }
    var line = active >= 0 ? state.lines[active] : null;
    if (line) {
      // 词级结构只在（行、曲目、形态）都一致时复用：每帧重建会把扫色
      // 进度重置掉，这里必须缓存。
      var words = wordsWithEnds(line);
      var key = (active === state.lastSingle && el._wordsKey === (words ? 1 : 0) && el._track === state.trackId)
        ? null : true;
      if (key) {
        el._wordsKey = words ? 1 : 0;
        el._track = state.trackId;
        state.lastSingle = active;
        el.innerHTML = lineHtml(line, words);
      }
      el.classList.remove('empty');
      sweepRow(el, posSec);
    } else {
      el.textContent = '♪';
      el.classList.add('empty');
    }
  }

  function renderKaraoke(active, posSec) {
    var cover = state.cover;
    var img = $('karaoke-cover'), disc = $('karaoke-disc');
    if (state.trackId == null) {
      $('karaoke-title').textContent = '未在播放';
      $('karaoke-artist').textContent = '';
      img.classList.add('hidden'); disc.classList.remove('hidden');
      $('karaoke-bar').style.width = '0%';
    } else {
      $('karaoke-title').textContent = state.title || '';
      $('karaoke-artist').textContent = state.artist || '';
      if (state.coverFor !== state.trackId) {
        state.coverFor = state.trackId;
        if (cover) {
          img.src = cover + (cover.indexOf('?') >= 0 ? '&' : '?') + CRED;
          img.classList.remove('hidden'); disc.classList.add('hidden');
        } else {
          img.classList.add('hidden'); disc.classList.remove('hidden');
        }
      }
      var dur = state.durationMs || 0;
      $('karaoke-bar').style.width = dur ? Math.min(100, interpolatedPos() / dur * 100) + '%' : '0%';
    }
    $('karaoke-paused').classList.toggle('hidden', state.playing || state.trackId == null);
    renderSingle($('karaoke-cur'), active, posSec);
  }

  function renderMinimal(active, posSec) {
    if (state.trackId == null) {
      $('min-title').textContent = '未在播放';
      $('min-artist').textContent = '';
    } else {
      $('min-title').textContent = state.title || '';
      $('min-artist').textContent = state.artist ? '· ' + state.artist : '';
    }
    renderSingle($('min-cur'), active, posSec);
  }

  function render() {
    var posMs = interpolatedPos();
    var posSec = posMs / 1000;
    var active = activeIndexAt(posMs);
    if (STYLE === 'full') renderFull(active, posSec);
    else if (STYLE === 'line') renderSingle($('line-cur'), active, posSec);
    else if (STYLE === 'karaoke') renderKaraoke(active, posSec);
    else renderMinimal(active, posSec);
  }

  async function poll() {
    try {
      var res = await fetch('/v1/overlay/lyric?' + CRED, { cache: 'no-store' });
      if (res.ok) {
        var data = await res.json();
        state.trackId = data.track_id || null;
        state.title = data.title || '';
        state.artist = data.artist || '';
        state.cover = data.cover || null;
        state.lines = data.lines || [];
        state.playing = !!data.playing;
        state.positionMs = data.position_ms || 0;
        state.durationMs = data.duration_ms || 0;
        state.wordByWord = !!data.wordByWord;
        state.fetchedAt = performance.now();
      }
    } catch (e) { /* 服务重启等瞬时失败：保持上一帧，下一轮再试 */ }
  }

  poll();
  setInterval(poll, 500);
  // 渲染走 rAF：位置内插 + 平滑滚动都在这一层，轮询只负责喂数据。
  (function loop() { render(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
