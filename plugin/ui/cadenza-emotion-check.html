<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cadenza emotion check</title>
<link rel="stylesheet" href="stanza/stanza.css">
<link rel="stylesheet" href="emotion.css">
<style>
  body { margin: 0; background: #0a0f0d; }
  #host { position: relative; width: 1100px; height: 620px; margin: 20px; background: #0a0f0d; }
</style>
</head>
<body>
<div id="host"></div>
<pre id="out" style="color:#9aa;font:12px monospace">running…</pre>
<script src="stanza/stanza-util.js"></script>
<script src="stanza/stanza-theme.js"></script>
<script src="stanza/stanza-textlayout.js"></script>
<script src="lyric-emotion-field.js"></script>
<script src="lyric-emotion.js"></script>
<script src="stanza/stanza-cadenza.js"></script>
<script>
(function () {
  'use strict';
  var EM = window.LyricEmotion;
  var LINES = [
    { start_ms: 0, end_ms: 5000, text: '晚风 吹过 你的 眼睛' },
    { start_ms: 5000, end_ms: 9000, text: '星光 落在 你我 之间' }
  ];
  var TOKENS0 = [
    { text: '晚风', start_ms: 0, end_ms: 1200 }, { text: '吹过', start_ms: 1200, end_ms: 2600 },
    { text: '你的', start_ms: 2600, end_ms: 3800 }, { text: '眼睛', start_ms: 3800, end_ms: 5000 }
  ];
  window.Stage = {
    lyrics: function () { return { lines: LINES, index: 0 }; },
    position: function () { return 500; },
    energy: function () { return 0.4; },
    lyricTokens: function () { return TOKENS0; }
  };
  var renderer = window.StanzaCadenza.init(document.getElementById('host'), function () {});
  var hash = null;
  function tick(n) { for (var i = 0; i < n; i += 1) renderer.frame(16); }
  function snapshot() {
    var nodes = Array.prototype.slice.call(document.querySelectorAll('.fl-cadz[data-emo-active]'));
    if (!nodes.length) return null;
    var node = nodes[0];
    var active = nodes.find(function (n) { return n.dataset.st === 'active'; });
    var waiting = nodes.find(function (n) { return n.dataset.st === 'waiting'; });
    return {
      emotion: node.getAttribute('data-emotion'),
      count: nodes.length,
      weight: getComputedStyle(node).fontWeight,
      spacing: getComputedStyle(node).letterSpacing,
      dy: nodes.map(function (n) { return getComputedStyle(n).getPropertyValue('--emo-dy').trim(); }),
      translate: nodes.map(function (n) { return getComputedStyle(n).translate; }),
      activeColor: active ? getComputedStyle(active.querySelector('.fl-body')).color : null,
      waitingColor: waiting ? getComputedStyle(waiting.querySelector('.fl-body')).color : null,
      palette: (EM.resolveForLine(0, { host: 'cadenza-check' }) || {}).palette
    };
  }
  async function select(id) {
    if (!hash) {
      var bound = await EM.bindLyrics({ lines: LINES });
      hash = bound.hash;
    }
    EM.setCueDoc({
      version: 1, lyricsHash: hash, source: 'fixture',
      lines: id === 'neutral' ? [] : [{ index: 0, emotion: id, intensity: 1, confidence: 1 }]
    });
    EM.commitAtBoundary();
    tick(8);
    var snap = snapshot();
    document.getElementById('out').textContent = JSON.stringify(snap, null, 2);
    return snap;
  }
  tick(8);
  window.__cadenzaCheck = { ready: true, select: select, snapshot: snapshot };
})();
</script>
</body>
</html>
