[server]
bind = "127.0.0.1"
port = 7634
expose_ui = true

[audio]
backend = "cpal"
volume = 0.800000011920929
spectrum_bands = 64

[library]
extensions = [
    "mp3",
    "flac",
    "wav",
    "m4a",
    "aac",
    "ogg",
    "oga",
    "opus",
    "ape",
    "wma",
    "aiff",
    "aif",
    "alac",
]
follow_symlinks = false

[online]
cache_max_bytes = 2147483648

[log]
level = "info"
format = "pretty"
