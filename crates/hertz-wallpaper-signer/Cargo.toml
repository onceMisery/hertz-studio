# SPDX-License-Identifier: MIT
[package]
name = "hertz-wallpaper-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent local wallpaper approval and signing service"
default-run = "hertz-wallpaper-signer"

[[bin]]
name = "hertz-wallpaper-root"
path = "src/root_main.rs"

[dependencies]
hertz-wallpaper = { path = "../hertz-wallpaper", features = ["community-release"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
sha2 = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
fslock = { workspace = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading",
  "Win32_System_IO",
] }
