# SPDX-License-Identifier: MIT
[package]
name = "vmusic-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Audio backends and the command actor that serialises playback"

[features]
default = ["playback"]
# Turning this off leaves only the null backend, which needs no sound card and
# is what CI and the headless integration tests run against.
playback = ["cpal", "symphonia", "rustfft", "num-complex", "rubato", "dep:windows"]

[dependencies]
vmusic-core = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
arc-swap = "1"

cpal = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
num-complex = { workspace = true, optional = true }
rubato = { version = "=0.16.2", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", optional = true, features = [
  "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio",
  "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Performance",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[[example]]
name = "resample_probe"
required-features = ["playback"]

[[example]]
name = "clocked_resample_probe"
required-features = ["playback"]

[[example]]
name = "device_clock_probe"
required-features = ["playback"]
