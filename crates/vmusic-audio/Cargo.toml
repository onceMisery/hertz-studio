# SPDX-License-Identifier: MIT
[package]
name = "vmusic-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Audio backends and the command actor that serialises playback"

[features]
default = ["playback"]
# Turning this off leaves only the null backend, which needs no sound card and
# is what CI and the headless integration tests run against.
playback = ["cpal", "symphonia", "rustfft", "num-complex"]

[dependencies]
vmusic-core = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
arc-swap = "1"

cpal = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
num-complex = { workspace = true, optional = true }
