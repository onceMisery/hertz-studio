<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24" role="img" aria-label="Hertz Studio 桌面歌词 · 小尺寸版">
  <title>Hertz Studio · 桌面歌词（32/16px 简化版）</title>
  <!--
    小尺寸简化规则：
    1) 去掉玻璃内描边与顶部高光（16px 下会糊成毛边）
    2) 竖条加粗到 2.6、歌词行加粗到 2.6，保证 16px 仍有 3px 可见笔画
    3) 歌词行取消渐隐改为实心，避免细部过渡丢失
    4) 最短的两根条（1 单位）补齐到 2，否则 16px 下直接消失
  -->
  <defs>
    <linearGradient id="glassS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161A21"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="24" height="24" rx="5.4" fill="url(#glassS)"/>

  <rect x="2.2" y="10.7" width="19.6" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.55"/>

  <g fill="none" stroke="#4C8DFB" stroke-linecap="round" stroke-width="2.6">
    <path d="M4 11.4v1.2"/>
    <path d="M8 9.2v5.6"/>
    <path d="M12 6.2v11.6"/>
    <path d="M16 8.4v7.2"/>
    <path d="M20 10.8v2.4"/>
  </g>
</svg>
