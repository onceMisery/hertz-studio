<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 24 24" role="img" aria-label="Hertz Studio 桌面歌词">
  <title>Hertz Studio · 桌面歌词</title>
  <defs>
    <!-- 玻璃底：近黑蓝，顶部略提亮 -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171B22"/>
      <stop offset="0.55" stop-color="#0E1014"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <!-- 歌词行：逐字高亮隐喻，左实右隐 -->
    <linearGradient id="lyric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <!-- 频谱条：品牌蓝，向上提亮 -->
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DAEFF"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 玻璃底板 -->
  <rect x="0" y="0" width="24" height="24" rx="5.6" fill="url(#glass)"/>
  <ellipse cx="11.6" cy="12" rx="9" ry="7.4" fill="url(#aura)"/>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.15" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <path d="M1.2 6.2A5 5 0 0 1 6.2 1.2h11.6A5 5 0 0 1 22.8 6.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="0.9"/>

  <!-- 歌词行（在频谱之下，形成层次） -->
  <rect x="1.7" y="11" width="20.6" height="2" rx="1" fill="url(#lyric)" opacity="0.5"/>

  <!-- 频谱：沿用官方 24 网格坐标与 1/6/13/8/3/1 节奏 -->
  <g fill="none" stroke="url(#bars)" stroke-linecap="round" stroke-width="1.8">
    <path d="M3 11.5v1"/>
    <path d="M6.5 9v6"/>
    <path d="M10 5.5v13"/>
    <path d="M13.5 8v8"/>
    <path d="M17 10.5v3"/>
    <path d="M20.5 11.5v1"/>
  </g>
</svg>
