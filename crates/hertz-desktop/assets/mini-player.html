<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Hertz 小窗</title>
<!-- 占位符由 app.rs 的 mini_page_html() 替换，与桌面歌词同一套拼装方式。 -->
<style>__MINI_CSS__</style>
</head>
<body data-pet="false" data-locked="false" data-playing="false" data-peek="false">
  <!-- 命中区：JS 把这些元素的矩形交给 native，宠物态下它们之外的地方全穿透。 -->
  <div id="capsule" data-hit>
    <!-- 宠物素材层的唯一出口：内置皮肤与用户素材（mini-skin/*）都从它显示。
         宠物态下它就是整个形象；悬停展开时缩成封面圆。data-art-failed 是
         「连内置默认都画不出来」的最后兜底开关，退回 ♫ 封面块。 -->
    <img id="pet-art" data-hit alt="桌面宠物" draggable="false">
    <div id="cover" data-hit><img id="cover-img" alt=""><svg id="cover-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 17.5V7l9-2v10.5" fill="none"/><circle cx="6.4" cy="17.5" r="2.1" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.5" r="2.1" fill="currentColor" stroke="none"/></svg></div>
    <div id="meta" data-hit>
      <div id="title">未在播放</div>
      <div id="subtitle">—</div>
    </div>
    <div id="transport">
      <button id="prev" class="icon" type="button" aria-label="上一首" data-hit><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12"/><path d="M19 6l-9 6 9 6z" fill="currentColor" stroke="none"/></svg></button>
      <button id="play" class="primary" type="button" aria-label="播放" data-hit>
        <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      </button>
      <button id="next" class="icon" type="button" aria-label="下一首" data-hit><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12"/><path d="M5 6l9 6-9 6z" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div id="progress" aria-hidden="true"><i id="progress-fill"></i></div>
  </div>

  <div id="flash" hidden></div>
<script>__MINI_JS__</script>
</body>
</html>
