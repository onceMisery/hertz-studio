<div id="shell">
  <div id="toolbar">
    <div id="drag" title="拖动歌词">⠿</div>
    <button id="lock" data-cmd="lock">锁定</button>
    <button id="layout" data-cmd="layout">单行</button>
    <button id="secondary-btn" data-cmd="secondary">次行：下一句</button>
    <button data-cmd="font-down">A−</button>
    <button data-cmd="font-up">A+</button>
    <button data-cmd="width-down">窄</button>
    <button data-cmd="width-up">宽</button>
    <button data-cmd="opacity-down">淡</button>
    <button data-cmd="opacity-up">浓</button>
    <button data-cmd="hide">隐藏</button>
    <button data-cmd="quit">退出</button>
  </div>
  <div id="stage">
    <div id="current" class="line current"></div>
    <div id="secondary" class="line secondary"></div>
    <div id="notice" class="notice"></div>
  </div>
</div>
