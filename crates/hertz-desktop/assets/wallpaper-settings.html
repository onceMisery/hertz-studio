<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hertz · 动态壁纸</title><style>
:root{color-scheme:dark;font:13px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;color:#eeeae1;background:#141413;--muted:#a9a69c;--line:#32322e;--accent:#e4dfd0;--surface:#1b1b19;--control:#242421}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 28px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.08em}
h1{margin:6px 0 0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.02em}
#settings-state{padding:4px 9px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;white-space:nowrap}
#settings-state[data-dirty=true]{color:var(--accent);border-color:#817760}
main{flex:1;min-height:0;overflow-y:auto;padding:0 28px 20px;scrollbar-width:thin;scrollbar-gutter:stable;scrollbar-color:#5a584e transparent}
section{padding-top:18px}
h2{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.field label{flex:1;min-width:0}
.field small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.field select{min-width:0;max-width:58%;background:var(--control);color:inherit;border:1px solid #45443d;border-radius:7px;padding:7px 9px;font:inherit;text-overflow:ellipsis}
.field input[type=checkbox]{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.path-row{align-items:flex-start;border:0;padding:9px 0 0;font-size:11px;color:var(--muted)}
.path{max-width:72%;overflow-wrap:anywhere;text-align:right;user-select:text}
.source-actions{display:flex;justify-content:flex-end;margin-top:10px}
footer{flex:none;padding:14px 28px 20px;border-top:1px solid var(--line);background:var(--surface)}
.actions{display:flex;gap:8px}
button{border:1px solid #45443d;border-radius:7px;background:var(--control);color:inherit;padding:8px 13px;font:inherit;cursor:pointer;transition:background 150ms,border-color 150ms}
button:hover:not(:disabled){background:#32322c;border-color:#817b6b}
button:active:not(:disabled){background:#3d3c34}
button.primary{background:var(--accent);border-color:var(--accent);color:#22221f;font-weight:600}
button.primary:hover:not(:disabled){background:#f5f0e3}
button:disabled,select:disabled,input:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#close{margin-right:auto;background:transparent}
#status{min-height:20px;margin:0 0 10px;color:var(--muted);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
#status.error{color:#ffb2ad}
@media(max-width:380px){header{padding:16px}main{padding:0 16px 12px}footer{padding:12px 16px}.field{gap:10px}.field select{max-width:55%}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<header><div><div class="eyebrow">Hertz · 桌面</div><h1>动态壁纸</h1></div><span id="settings-state" role="status">读取中</span></header>
<main>
  <section aria-labelledby="source-title">
    <h2 id="source-title">音乐来源</h2>
    <div class="field"><label for="profile">播放器来源<small>每个来源保留独立的桌面设置</small></label><select id="profile" disabled></select></div>
    <div class="field path-row"><span>数据目录</span><span class="path" id="profile-path"></span></div>
    <div class="source-actions" hidden><button id="switch-source" disabled>切换来源</button></div>
  </section>
  <section aria-labelledby="display-title">
    <h2 id="display-title">播放与显示</h2>
    <div class="field"><label for="enabled">启用桌面壁纸<small>在桌面图标后显示动态场景</small></label><input id="enabled" type="checkbox" role="switch" disabled></div>
    <div class="field"><label for="monitor">目标显示器</label><select id="monitor" disabled></select></div>
    <div class="field"><label for="fps">流畅度<small>较低帧率可减少资源占用</small></label><select id="fps" disabled><option value="15">15 fps · 节能</option><option value="30">30 fps · 均衡</option><option value="60">60 fps · 流畅</option></select></div>
    <div class="field"><label for="music">跟随音乐<small>让场景随播放的音乐产生律动</small></label><input id="music" type="checkbox" role="switch" disabled></div>
  </section>
</main>
<footer>
  <p id="status" role="status" aria-live="polite">正在读取设置…</p>
  <div class="actions"><button id="close">关闭</button><button id="preview" disabled>预览效果</button><button id="apply" class="primary" disabled>应用设置</button></div>
</footer>
<script>__SETTINGS__</script>
</body></html>
