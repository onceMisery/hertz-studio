[package]
name = "hertz-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hertz desktop lyrics host for Windows 11 x64"

[features]
# 仅 debug 原生媒体/导入回归使用的驱动；正式及 release 构建不含页面测试入口。
wallpaper-media-probe = []

[[bin]]
name = "hertz-desktop"
path = "src/main.rs"

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
tray-icon = { version = "=0.24.2", default-features = false }
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# 系统音频分析（P1-06b §11.3）：复用 2048 点 Hann FFT 算法，与播放器
# （vmusic-audio）锁同一 rustfft 版本，黄金向量测试钉住频带映射一致。
rustfft = { workspace = true }
num-complex = { workspace = true }

hertz-desktop-ipc = { path = "../hertz-desktop-ipc" }
hertz-wallpaper = { path = "../hertz-wallpaper" }
sha2 = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
# 流式 PNG 像素/CRC 复核；WebView2 会将部分损坏 PNG 容忍为空白图。
png = "0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
moxcms = "=0.8.1"
zip = { workspace = true }
# 媒体流的 COM IStream 实现必须与 webview2-com/wry 锁定同一 windows 版本
# （Cargo.lock 已是 0.62.2），否则接口不互通（设计 §8.1）。
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Performance",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
] }
# 与 wry/webview2-com 锁定同版本，IStream 才能交给 WebView2（设计 §8.1）。
webview2-com = "=0.39.1"
windows-core = "0.62"
sqlx = { workspace = true }
tokio = { workspace = true }
