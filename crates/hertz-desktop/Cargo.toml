[package]
name = "hertz-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hertz desktop lyrics host for Windows 11 x64"

[[bin]]
name = "hertz-desktop"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
tray-icon = { version = "=0.24.2", default-features = false }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
