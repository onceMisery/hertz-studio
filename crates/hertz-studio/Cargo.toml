# SPDX-License-Identifier: MIT
[package]
name = "hertz-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The hertz-studio service binary: HTTP + WebSocket API and web UI"

[features]
default = []
full = ["dep:aes", "dep:cbc", "dep:num-bigint", "dep:num-traits"]

[dependencies]
vmusic-core = { workspace = true }
vmusic-audio = { workspace = true }
vmusic-lan = { workspace = true }
zeroize = "1"
vmusic-store = { workspace = true }
vmusic-library = { workspace = true }
vmusic-lyrics = { workspace = true }
vmusic-beats = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
serde_urlencoded = { workspace = true }
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
sqlx = { workspace = true }
symphonia = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
aes = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
toml = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
time = { workspace = true }
unicode-normalization = "0.1"
rmcp = { workspace = true }
fslock = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
dirs = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
ammonia = { version = "=4.2.4", default-features = false }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }
