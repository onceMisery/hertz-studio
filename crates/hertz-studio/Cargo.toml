[package]
name = "hertz-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The mmusic-studio service binary: HTTP + WebSocket API and web UI"

[dependencies]
vmusic-core = { workspace = true }
vmusic-audio = { workspace = true }
vmusic-store = { workspace = true }
vmusic-library = { workspace = true }
vmusic-lyrics = { workspace = true }
vmusic-beats = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
symphonia = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
