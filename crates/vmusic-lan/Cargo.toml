[package]
name = "vmusic-lan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded native room transport, clock estimation and protocol"

[dependencies]
subtle = "2"
zeroize = "1"
vmusic-core = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
futures = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
