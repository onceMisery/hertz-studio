[package]
name = "hertz-wallpaper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hertz wallpaper package contract: HWPK v1 manifest, archive validation and registry catalog"

[dependencies]
image = { version = "=0.25.10", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
moxcms = { version = "=0.8.1", optional = true }
png = { version = "0.18.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"], optional = true }
serde_jcs = { version = "=0.2.0", optional = true }

[dev-dependencies]
base64 = { workspace = true }

[features]
image-prepare = ["dep:image", "dep:moxcms", "dep:png"]
community-release = ["dep:base64", "dep:ed25519-dalek", "dep:serde_jcs"]
