[workspace]
resolver = "2"
members = ["crates/*", "plugin/backend", "plugin/vendor/dbx-plugin-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 工具链下界。取值来自锁定依赖图里各 crate 自己声明的 rust-version 上界：
# cookie_store / encoding_rs / home / icu_* 等声明的都是 1.88，所以 README 原先
# 写的「1.85+」低了一档。改动依赖后请重新核对（把 rust-version 从锁里的每个包
# 抓出来取最大即可），写低了会让用户拿到一堆看不懂的下游编译错误。
rust-version = "1.88"
license = "MIT"
authors = ["hertz-studio contributors"]
description = "A local-first, self-hosted music service and player"
homepage = "https://github.com/onceMisery/hertz-studio"
repository = "https://github.com/onceMisery/hertz-studio"

[workspace.dependencies]
# --- internal ---
vmusic-core = { path = "crates/vmusic-core", version = "0.1.0" }
vmusic-audio = { path = "crates/vmusic-audio", version = "0.1.0" }
vmusic-store = { path = "crates/vmusic-store", version = "0.1.0" }
vmusic-library = { path = "crates/vmusic-library", version = "0.1.0" }
vmusic-lyrics = { path = "crates/vmusic-lyrics", version = "0.1.0" }
vmusic-beats = { path = "crates/vmusic-beats", version = "0.1.0" }

# --- async / web ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net"] }
axum = { version = "0.8", features = ["ws", "macros"] }
futures = "0.3"
# 在线曲库代理：第三方音乐接口不带 CORS 头，必须由服务端代发请求。
# 用 rustls 而不是 native-tls，免得在 Windows 上引入 OpenSSL 构建依赖。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }

# --- data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# axum 的 Query<T> 就是 serde_urlencoded::from_str。RPC 门面走同一个编解码器，
# 两个宿主的取参语义才逐字一致（见 crates/hertz-studio/src/rpc/mod.rs 的 query_as）。
serde_urlencoded = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
md-5 = "0.10"
sha1 = "0.10"
# DBX 插件形态下封面走 JSON 信封，二进制只能 base64 过一道（HTTP 版是裸 body）。
base64 = "0.22"
# 酷狗扫码登录换票的客户端载荷加密（平台公开算法：AES-128-CBC + 1024 RSA）。
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
num-bigint = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
notify = "8"
dirs = "5"

# --- audio ---
# 按 vmusic-library 的 AUDIO_EXTENSIONS 逐个裁：只留扩展名真的用得到的格式与
# 解码器，丢掉 mkv / caf（我们的扩展名表里没有这两种容器，扫描都不会收进来）。
#   mp3 → mpa（含 mp1/mp2）· flac → flac · wav/aiff → wav + aiff + pcm + adpcm
#   m4a/aac/alac → isomp4 + aac + alac · ogg/oga → ogg + vorbis
# 扩展名表里的 opus / ape / wma 本来就没有对应解码器（symphonia 0.5 不支持），
# 属于「扫描收得进、播放会报 unsupported」的既有差距，不在这里假装支持。
# 改了这行请跑 `cargo test -p vmusic-library --lib symphonia_features`。
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "mpa",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
cpal = "0.15"
rustfft = "6.2"
num-complex = "0.4"

# --- observability / config / errors ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
panic = "abort"
