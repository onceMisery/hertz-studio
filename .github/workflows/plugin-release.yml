# SPDX-License-Identifier: MIT
#
# 把插件打成 DBX 市场要的「未签名候选」并挂到 GitHub Release 上。
#
# 为什么单独一个 workflow，而不是塞进 release.yml：
#   release.yml 的边界是「手动触发、产物只供人工检视、绝不自动发布」；上架要的恰恰相反
#   ——候选必须挂在不可变 URL 上（reviewer 按 release-candidates.json 逐个核对 SHA-256），
#   并由 DBX 侧统一签名。签名私钥不在我们手里，所以我们只交候选，不交"最终包"。
#   详见 dbx 仓库 plugins/RELEASING.md。
#
# 触发方式：建一个 Release（草稿也行）→ publish → 本 workflow 跑 5 个 target →
# 把 5 个 .dbxp + 5 个 .artifact.json + 合并的 release-candidates.json 回传到该 Release。
# 之后按 store 仓 CONTRIBUTING.md 提**一个 PR**：candidates/<plugin-id>.json（候选元数据）
# + publishers/<publisher-id>.json（首次提交才要），签名由维护者在那条 PR 上跑。
#
# 不可原地重建：同名版本一旦发布过，改任何字节都得换新 version（RELEASING.md「Immutability」）。

name: release dbx plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # 只有「tag 名 == hertz-plugin-v + manifest 里的 version」才允许打候选。
  # 为什么要精确等值而不是按前缀过滤：任何一次 release publish 都会触发本 workflow。
  # 2026-10-10 实测——为了挂截图另发一条 hertz-plugin-v0.1.0-screenshots，就把 0.1.0
  # 候选重编了一遍塞进去，而 windows-x64 与已提交那套差 5 字节（同一个钉住的 CLI、
  # plugin/ 一个字节没改），于是同一版本号在两条 URL 上有两种字节。
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.match.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: match
        run: |
          version="$(python3 -c 'import json;print(json.load(open("plugin/manifest.json"))["version"])')"
          want="hertz-plugin-v${version}"
          got="${{ github.event.release.tag_name }}"
          if [ "$got" = "$want" ]; then
            echo "tag=$got" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::notice::跳过候选打包：release tag '${got}' 不是上架用的 '${want}'"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    # 钉到 v0.6.38 那个 tag 背后的 commit（不是 tag 名）：tag 可以被上游挪走，
    # 挪一次同一个源码 tag 就换了打包步骤，违反下面那条不可变约束。
    # 上游原先的 plugin-sdk-v1 分支已不存在——用它会让整条链路连调度都调不起来。
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@069adbc5ab35a331a86d199b306bbd2963813ade
    with:
      release-tag: ${{ github.event.release.tag_name }}
      # 脚本内部 cd 进 plugin/ 打包，所以这里保持仓库根为工作目录，
      # 产物 glob 也按 plugin/dist 写（可复用 workflow 会把两者拼起来找文件）。
      working-directory: .
      package-command: PLUGIN_RELEASE=1 bash scripts/ci-package-plugin.sh
      package-path: plugin/dist/*.dbxp
      metadata-path: plugin/dist/*.artifact.json
      # 候选用的 CLI 版本必须钉死：不钉的话，上游发新版就会让我们同一个源码 tag
      # 打出字节不同的包，直接违反上面的不可变约束。
      plugin-cli-version: 0.1.2
      # 插件 sidecar 是 Rust（cpal + ashpd），没有 Go 后端；空字符串让矩阵跳过 Go 安装。
      go-version: ""
