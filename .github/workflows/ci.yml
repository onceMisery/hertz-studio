# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Frontend contract checks
        run: |
          node scripts/check-assets.js
          node scripts/check-css-tokens.js
          node scripts/check-creative.js
          node scripts/check-favorites.js
          node scripts/check-online.js
          node scripts/check-online-playlist-view.js
          node scripts/check-stage-control.js

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The audio tests run against the null backend so they do not need a
      # sound card on the runner.
      - name: Test
        run: cargo test --workspace
        env:
          VMUSIC_BACKEND: null

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Smoke test
        run: bash scripts/smoke.sh 7899
        env:
          VMUSIC_BACKEND: null
