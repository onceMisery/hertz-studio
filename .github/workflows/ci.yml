# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 两个都是构建期硬依赖，runner 镜像都不自带，缺任何一个 cargo 都会在
          # 编依赖时就退 101（看着像 lint 或测试失败，其实是 build script 挂了）：
          #   - libasound2-dev：cpal 在 Linux 上走 ALSA，alsa-sys 的 build.rs 用
          #     pkg-config 找 alsa，找不到直接 panic。
          #   - libdbus-1-dev：keyring 3 在 Linux 上走 dbus-secret-service →
          #     dbus → libdbus-sys，同样构建期就要 pkg-config 找到 libdbus-1。
          # macOS 走 coreaudio + apple-native、Windows 走 wasapi + windows-native，
          # 两边都不碰这两个库，所以只有 ubuntu 这一格会红。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Frontend contract checks
        # 聚合入口：语法 → 静态 guard（形状/接线/禁用词）→ 行为回归（vm 沙箱跑真实
        # 模块）→ 活体（默认不跑：要真浏览器与起着的服务，环境不齐只会报环境错）。
        # 「哪一步在防什么失败」写在 scripts/check-frontend.js 的 why 字段里；本地
        # 全跑一遍是同一条命令，不用再从 YAML 里复制二十行。默认集合与拆分写法等价。
        run: node scripts/check-frontend.js

      - name: Check formatting
        # 不用 --all：它会把 vendored 的 dbx-plugin-sdk 一起重排，而那份 src/lib.rs
        # 必须与上游字节一致（见 NOTICE）。rustfmt.toml 的 ignore 对 cargo fmt 显式
        # 传入的 crate 根无效，cargo fmt 也没有 --exclude，所以逐包列出。
        # 新增 workspace 成员时记得补进来。
        run: >-
          cargo fmt
          -p hertz-studio
          -p vmusic-core
          -p vmusic-audio
          -p vmusic-store
          -p vmusic-library
          -p vmusic-lyrics
          -p vmusic-beats
          -p dbx-plugin-hertz
          -- --check

      # 临时诊断（定位完撤掉）：匿名读不到 Actions 日志（jobs/{id}/logs 要 admin，
      # check-run 的 output 也是空的），但 ::error:: 写出的 annotation 公开可读。
      #
      # 两步都显式写 shell: bash：GitHub 在 Linux 上对没写 shell 的 run 用的是
      # `bash -e`，**不带 pipefail**，于是 `cargo … | tee` 的退出码是 tee 的 0，
      # 失败会被吞掉——上一版就栽在这里，clippy 明明还在红却报成绿。
      # 写成 shell: bash 才是 `-eo pipefail`。
      #
      # 两步都 continue-on-error、最后统一收口：一次 run 同时拿到 clippy 与 test
      # 的错误，不用为了看第二个再推一轮。
      - name: Clippy
        id: clippy
        shell: bash
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: never
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      # The audio tests run against the null backend so they do not need a
      # sound card on the runner.
      #
      # `VMUSIC_BACKEND` 三处都必须加引号：不带引号的 null 在 YAML 里是 null 标量，
      # Actions 导出成**空串**，而 bootstrap.rs 只把字面 "null" 当 Null 后端、其余
      # 一律 cpal，health 于是报出 backend:"" —— 既没有这个后端名，也让
      # check-plugin-sidecar.js 的「backend=null 就跳过频谱断言」判据失效。
      - name: Test
        id: test
        shell: bash
        continue-on-error: true
        env:
          VMUSIC_BACKEND: "null"
          CARGO_TERM_COLOR: never
        run: cargo test --workspace 2>&1 | tee test.log

      - name: Surface failures as annotations
        if: steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure'
        shell: bash
        run: |
          # 顶层 env 把 CARGO_TERM_COLOR 设成 always，日志行是以 ANSI 转义开头的，
          # 上一版 `^error` 锚定 grep 因此一条都没匹配上，只发出了「clippy failed」
          # 这一句。这里两层保险：上面两步各自把颜色关掉，这里再 sed 去一次转义。
          #
          # 多行要合并进**一条** annotation（%0A 编码换行）：GitHub 每次 run 的
          # error annotation 有 10 条上限，一行一条发几十行会被直接截断。
          emit() {
            local tag="$1" file="$2" body
            [ -f "$file" ] || return 0
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$file" > "${file}.clean"
            # 换行要编成 %0A 才能塞进一条 annotation。注意转义顺序：先把 % 变成
            # %25，再处理 \r——反过来的话 %0D 里那个 % 会被二次转义。
            # （别用 paste -sd'@NL@'：-d 接的是**字符列表**、会循环取用，不是字符串。）
            body="$(
              {
                # left:/right: 必须一起顶出来：断言失败只写「assertion failed」等于
                # 没写——实际计数与尺寸在紧随其后的两行里（零分配断言靠它分辨「谁分配的」）。
                grep -nE '(^error|^warning|^[[:space:]]*--> |FAILED|^failures:|panicked at|assertion|^ *left:|^ *right:|test result:)' "${file}.clean" | head -25
                echo '===== tail ====='
                tail -35 "${file}.clean"
              } | awk '{ gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0 }'
            )"
            echo "::error title=${tag} failed on ${{ matrix.os }}::${body}"
          }
          if [ "${{ steps.clippy.outcome }}" = "failure" ]; then emit clippy clippy.log; fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then emit test test.log; fi
          exit 1

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 同 test job：cpal 要 ALSA、keyring 要 libdbus-1，都是构建期硬依赖。
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Smoke test
        id: smoke
        shell: bash
        continue-on-error: true
        run: bash scripts/smoke.sh 7899 2>&1 | tee smoke.log
        env:
          VMUSIC_BACKEND: "null"
      # 与 test job 同一套临时诊断：smoke 只在 ubuntu 跑，红了没有第二格可对照，
      # 而日志匿名读不到，只能把尾部顶成 annotation。定位完与 test job 那处一起撤。
      - name: Surface smoke failure as annotation
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          body="$(sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' smoke.log | tail -60 | awk '{ gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0 }')"
          echo "::error title=smoke failed on ubuntu-latest::${body}"
          exit 1
      - name: Library and filesystem integration
        if: steps.smoke.outcome == 'success'
        run: python3 scripts/check-library-api.py --maintenance
      - name: DBX plugin sidecar protocol
        id: sidecar
        if: steps.smoke.outcome == 'success'
        # 真起 sidecar、用 stdio 喂 JSON-RPC：插件形态唯一的集成守卫（信封、路由表、
        # 错误契约，以及扫描 → 列出曲目 → load → play 的端到端）。null 后端下频谱
        # 断言自动跳过，所以 runner 不需要声卡。每日推荐那一条会真的打一次上游
        # （开放授权平台不需要登录），断言只看形状与判别式，对方限流或离线不会假红。
        #
        # shell: bash 是必须的：不写的话 Linux 上是 `bash -e`、不带 pipefail，
        # `node … | tee` 的退出码会变成 tee 的 0，检查真失败了也会被报成绿。
        shell: bash
        continue-on-error: true
        run: |
          cargo build -p dbx-plugin-hertz
          node scripts/check-plugin-sidecar.js 2>&1 | tee sidecar.log
        env:
          VMUSIC_BACKEND: "null"
      # 临时诊断（定位完与 test job 那处一起撤）：这一步红时只有「exit code 1」，
      # 而检查脚本自己打出的 FAIL 条目、中断原因与失败清单都在匿名读不到的日志里。
      # 注意失败清单在最后，所以要先把带关键词的行顶出来、再补一段尾部。
      - name: Surface sidecar failure as annotation
        if: steps.sidecar.outcome == 'failure'
        shell: bash
        run: |
          body="$(
            {
              grep -nE '(^  FAIL|检查中断|sidecar stderr|^  - |协议检查：)' sidecar.log | head -25
              echo '===== tail ====='
              tail -25 sidecar.log
            } | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | awk '{ gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0 }'
          )"
          echo "::error title=sidecar failed on ubuntu-latest::${body}"
          exit 1
