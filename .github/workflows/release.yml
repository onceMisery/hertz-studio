# SPDX-License-Identifier: MIT
#
# Release 打包流水线。
#
# 设计边界（计划第 12 项）：
#   - 仅 workflow_dispatch 手动触发，绝不自动推送/发布/上传 Release；
#     产物留在 workflow run 的 artifacts 里，由维护者人工检查后自行发布。
#   - 两种产物并行出：
#       * 独立形态：单二进制 hertz-studio(.exe)，web 资源编译期嵌入，配 README + LICENSE；
#       * 插件形态：.dbxp（sidecar + ui + manifest），由 dbx-plugin CLI 打包。
#   - 校验和只在 summary 里算一次。原先每个平台各算一份再由 summary 拼接，但
#     download-artifact 的 merge-multiple 会把文件摊平到同一层，`cat */SHA256SUMS.txt`
#     永远匹配不到子目录，合并结果是空的；而 Windows 那段为了绕开没有 sha256sum
#     而内嵌的多行 Python 又必须顶格写，直接冲破了 run: | 的块标量——整个文件
#     从加入起就解析失败，GitHub 每次 push 都建一个 0 job 的 run 标记为 failure。
#     summary 跑在 ubuntu 上，sha256sum 现成，收归一处两个问题一起消失。
#   - 每平台产物名带 target，.dbxp 的文件名由 CLI 按 <插件id>-<版本>-<target> 生成。

name: release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "本次构建说明（可选，仅记录在 run summary）"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # 独立形态：单二进制
  # -------------------------------------------------------------------------
  build:
    name: binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cpal 要 ALSA、keyring 3 经 dbus-secret-service 要 libdbus-1，两者构建期
      # 就用 pkg-config 探测系统库，runner 镜像都不自带（详见 ci.yml 同名步骤）。
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # 按名字取版本，别用 packages[0]：workspace 成员的顺序不是契约，
          # 加一个排在 hertz-studio 前面的成员就会静默地把版本号取错。
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='hertz-studio'))")"
          NAME="hertz-studio-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          # 只拷可执行文件本体：MSVC 下 hertz-studio* 会把 .pdb 调试符号一并带进包。
          BIN="target/${{ matrix.target }}/release/hertz-studio"
          if [ -f "$BIN.exe" ]; then cp "$BIN.exe" "dist/${NAME}/hertz-studio.exe";
          elif [ -f "$BIN" ]; then cp "$BIN" "dist/${NAME}/hertz-studio";
          else echo "binary not found" >&2; exit 1; fi
          cp README.md LICENSE "dist/${NAME}/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            python3 -c "import shutil; shutil.make_archive('${NAME}', 'zip', '.', '${NAME}')"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
          fi
          rm -rf "${NAME}"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 插件形态：.dbxp
  # -------------------------------------------------------------------------
  plugin:
    name: plugin ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin-${{ matrix.os }}

      # Linux 的 ALSA/libdbus 依赖不在这里装：打包脚本里装，发布链路（可复用 workflow
      # 没有装系统包的钩子）与这条检视链路才会拿到同一套前置。
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dbx plugin CLI
        # 与 plugin-release.yml 的 plugin-cli-version 保持一致：CLI 版本一变，同一个
        # 源码 tag 就会打出字节不同的包，检视用的产物和上架用的候选就对不上了。
        run: npm install -g @dbx-app/plugin-cli@0.1.2

      - name: Package .dbxp
        shell: bash
        # 与发布链路共用一个脚本：Linux 依赖、打包、元数据核对都在里面。
        # 不设 PLUGIN_RELEASE ⇒ 元数据里的 url 留裸文件名（这条链路不发布，只检视）。
        run: bash scripts/ci-package-plugin.sh

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: dbxp-${{ matrix.os }}
          path: |
            plugin/dist/*.dbxp
            plugin/dist/*.artifact.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 合并校验和
  # -------------------------------------------------------------------------
  summary:
    name: merge checksums
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA256SUMS
        shell: bash
        run: |
          cd dist
          ls -la
          # merge-multiple 把所有产物摊平在同一层，所以这里直接对文件算，
          # 不再指望各平台自己带一份校验和上来。
          # nullglob 是必需的：某个 glob 不中时 bash 会把字面量传给 sha256sum，
          # 它会去读 stdin 把整步挂死。
          shopt -s nullglob
          files=(./*.zip ./*.tar.gz ./*.dbxp)
          if [ "${#files[@]}" -eq 0 ]; then echo "no artifacts to checksum" >&2; exit 1; fi
          sha256sum "${files[@]}" | sed 's|\./||' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## Release artifacts"
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            if [ -n "${{ github.event.inputs.notes }}" ]; then
              echo "${{ github.event.inputs.notes }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: dist/*
          if-no-files-found: error
